<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <form action="" method="get">
      <label> Nome:</label>
      <input type="text" name="nome" required />

      <br /><br />

      <label> Email: </label>
      <input type="email" name="email" required />

      <br /><br />

      <input type="submit" value="Enviar" required />

      <br /><br />

      <label> senha: </label>
      <input type="password" name="senha" required />

      <br /><br />

      <button type="reset">limpar</button>

      <label> Data de Nascimento:</label>
      <input /> type="radio" name="genero" value="masculino"> masculino
      <input /> type="radio" name="genero" value="femenino"> femenino

      <br /><br />

      <label>Escolha de gênero</label>
      <input type="radio" name="Gênero" value="masculino" /> masculino
      <input type="radio" name="Gênero" value="femenino" /> femenino

      <label> Escolha seu interrese:</label>
      <input type="checkbox" name="interrese" value="esporte" /> esporte

      <br /><br />

      <input type="checkbox" name="interrese" value="Musica" /> Musica

      <br /><br />

      <input type="checkbox" name="interrese" value="Ler" /> Ler

      <br /><br />

      <input type="checkbox" name="interrese" value="Programar" /> Programar

      <label> Escolha uma linguagem: </label>
      <select name="linguagem">
        <option value="html">HMTL</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
      </select>

      <br /><br />

      <label> Mensagem:</label><br />
      <textarea name="mensagem" rows="4" cols="50"></textarea>

      <br /><br />

      <button>Enviar foto</button>
      <input type="file" />
    </form>
  </body>
</html>
